<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://db.onlinewebfonts.com/c/e5cf4323214de97c3428d64ece016410?family=Integral+CF"
            rel="stylesheet"
        />
        <link
            href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="css/font-awesome.css" />
        <link rel="stylesheet" href="css/bootstrap.css" />
        <link rel="stylesheet" href="css/styles.css" />
        <title>Shop.Co</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg sticky-top">
            <div
                class="container d-flex justify-content-center align-items-center" style="gap:40px"
            >
                <div class="navbar-left d-flex justify-content-center align-items-center" style="gap:20px">
                    <button
                        class="navbar-toggler border-0 text-dark"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNavDropdown"
                        aria-controls="navbarNavDropdown"
                        aria-expanded="false"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <h1 class="navbar-brand fs-2 fw-bold text-uppercase mb-0">
                        shop.co
                    </h1>
                </div>
                <div class="collapse navbar-collapse" style="gap:24px" id="navbarNavDropdown">
                    <ul class="navbar-nav d-flex justify-content-center">
                        <li class="nav-item">
                            <a href="#" class="nav-link text-dark fw-regular"
                                >Shop <i class="fas fa-angle-down"></i
                            ></a>
                        </li>
                        <li class="nav-item">
                            <a
                                href="#top-selling"
                                class="nav-link text-dark fw-regular"
                                >On Sale</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                href="#new-arrival"
                                class="nav-link text-dark fw-regular"
                                >New Arrival</a
                            >
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link text-dark fw-regular"
                                >Brands</a
                            >
                        </li>
                    </ul>
                </div>

                <div class="navbar-right d-flex align-items-center gap-4 flex-grow-1 justify-content-end">
                    <div class="input-group flex-grow-1 d-none d-lg-flex">
                        <span
                            class="input-group-text rounded-start-5 bg-primary"
                            ><i class="bi bi-search"></i
                        ></span>
                        <input
                            type="text"
                            name="search"
                            id="search"
                            class="form-control rounded-end-5 border-0 bg-primary"
                            placeholder="Search for products.."
                        />
                    </div>

                    <a href="#" class="d-lg-none text-dark">
                        <i class="bi bi-search fs-5"></i>
                    </a>

                    <div class="nav-icons d-flex justify-content-center align-items-center" style="gap: 14px" flex-shrink-0>
                        <a href="#" aria-label="Cart"
                            ><img
                                src="images/cart-icon.svg"
                                alt=""
                                class="img-fluid" width="24" height="24"
                            />
                        </a>
                        <a href="#">
                            <img
                                src="images/user-icon.svg"
                                alt=""
                                class="img-fluid"
                            />
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
